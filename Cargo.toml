[package]
name = "ck3_history_extractor"
version = "2.4.8"
edition = "2024"
authors = ["TCA"]
description = "A tool for generating an encyclopedia from your Crusader Kings III save file"
readme = "./README.md"
repository = "https://github.com/TCA166/CK3-history-extractor"
license = "MIT"
keywords = [
    "crusader-kings-3",
    "save-files",
    "visualiser",
    "extractor",
    "utility",
]
build = "build.rs"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
minijinja = { version = "2.17.1", features = ["loader"] }
serde_json = "1.0.149"
dialoguer = { version = "0.12.0", features = ["completion", "history"] }
open = "5.3.3"
indicatif = "0.18.4"
keyvalues-parser = "0.2.3"
human-panic = "=2.0.8"
clap = {version="4.6.0", features = ["derive"]}
derive_more = { version = "2.1.1", features = ["from", "display"] }
jomini = "0.34.1"
phf = "0.14.0"
ck3_history_extractor_lib = { path = "lib", features = ["display"] }

[features]
internal = []
permissive = ["ck3_history_extractor_lib/permissive"]
tokens = []

[build-dependencies]
phf_codegen = "0.14.0"

[workspace]
members = ["lib"]
